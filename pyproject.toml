[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-watcher"
version = "1.0.0"
description = "Watches SSH and sudo logs, detects brute force and suspicious logins, alerts on Discord and exports Prometheus metrics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []   # standard library only, easy to drop on any server

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
log-watcher = "logwatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
